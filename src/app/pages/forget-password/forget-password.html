<div class="min-h-screen flex items-center justify-center py-12 px-4 bg-amazon-gray-light">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border border-amazon-gray-border space-y-8">
    
    <!-- Header العام -->
    <div class="text-center sm:text-left">
      <h2 class="text-2xl font-bold text-amazon-text">Password Recovery</h2>
      <p class="text-sm text-amazon-text-secondary mt-1">Complete the steps below to reset your password.</p>
    </div>

    @if(step===1){
        <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
      <h3 class="text-sm font-bold text-amazon-text mb-3 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-amazon-orange text-white flex items-center justify-center text-xs">1</span>
        Enter Your Email
      </h3>

      <form [formGroup]="verfiyEmail" (ngSubmit)="verifyEmailSubmit()" class="space-y-3">
        <div>
          <label for="email" class="block text-xs font-semibold text-amazon-text mb-1">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-amazon-text-secondary pointer-events-none">
              <i class="fa-solid fa-envelope text-xs"></i>
            </span>
            <input 
              formControlName="email" 
              type="email" 
              id="email" 
              placeholder="Enter your email"
              class="w-full pl-10 pr-4 py-2 bg-white border border-amazon-gray-border rounded-xl text-amazon-text text-sm focus:outline-none focus:border-amazon-orange focus:ring-2 focus:ring-amazon-orange/20"
            >
          </div>
        </div>

        <button 
          type="submit"
          class="w-full py-2.5 px-4 bg-amazon-orange hover:bg-amazon-orange-hover text-amazon-text font-bold rounded-xl shadow-sm text-xs cursor-pointer transition-all">
          Verify Email
        </button>
      </form>
    </div>
    }
  

    @if(step===2){
        <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
      <h3 class="text-sm font-bold text-amazon-text mb-3 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-amazon-orange text-white flex items-center justify-center text-xs">2</span>
        Enter Reset Code
      </h3>

      <form [formGroup]="verifyResetCode" (ngSubmit)="verifyCodeSubmit()" class="space-y-3">
        <div>
          <label for="resetCode" class="block text-xs font-semibold text-amazon-text mb-1">6-Digit Code</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-amazon-text-secondary pointer-events-none">
            <i class="fa-solid fa-shield-keyhole text-xs"></i>
            </span>
            <input 
              formControlName="resetCode" 
              type="text" 
              id="resetCode" 
              maxlength="6"
              placeholder="Enter 6-digit code"
              class="w-full pl-10 pr-4 py-2 bg-white border border-amazon-gray-border rounded-xl text-amazon-text text-sm focus:outline-none focus:border-amazon-orange focus:ring-2 focus:ring-amazon-orange/20 tracking-widest font-bold"
            >
          </div>
        </div>

        <button 
          type="submit"
          class="w-full py-2.5 px-4 bg-amazon-orange hover:bg-amazon-orange-hover text-amazon-text font-bold rounded-xl shadow-sm text-xs cursor-pointer transition-all">
          Verify Code
        </button>
      </form>
    </div>

    }
    @if (step===3) {
          <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100">
      <h3 class="text-sm font-bold text-amazon-text mb-3 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-amazon-orange text-white flex items-center justify-center text-xs">3</span>
        Set New Password
      </h3>

    <form [formGroup]="resetPassword" (ngSubmit)="verifyPasswordSubmit()" class="space-y-3">
  
  <!-- Email Field -->
  <div>
    <label for="resetEmail" class="block text-xs font-semibold text-amazon-text mb-1">Email Address</label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-amazon-text-secondary pointer-events-none">
        <i class="fa-solid fa-envelope text-xs"></i>
      </span>
      <input 
        formControlName="email" 
        type="email" 
        readonly
        id="resetEmail"
        placeholder="Enter your email"
        class="w-full pl-10 pr-4 py-2 bg-white border border-amazon-gray-border rounded-xl text-amazon-text text-sm focus:outline-none focus:border-amazon-orange focus:ring-2 focus:ring-amazon-orange/20"
      >
    </div>
  </div>

  <!-- New Password Field -->
  <div>
    <label class="block text-xs font-semibold text-amazon-text mb-1">New Password</label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-amazon-text-secondary pointer-events-none">
        <i class="fa-solid fa-lock text-xs"></i>
      </span>
      <input 
        formControlName="newPassword" 
        type="password" 
        placeholder="Enter new password"
        class="w-full pl-10 pr-4 py-2 bg-white border border-amazon-gray-border rounded-xl text-amazon-text text-sm focus:outline-none focus:border-amazon-orange focus:ring-2 focus:ring-amazon-orange/20"
      >
    </div>
  </div>

  <!-- Submit Button -->
  <button 
    type="submit"
    class="w-full py-2.5 px-4 bg-amazon-orange hover:bg-amazon-orange-hover text-amazon-text font-bold rounded-xl shadow-sm text-xs cursor-pointer transition-all mt-2">
    Reset Password
  </button>
</form>
    </div>
    }



    <!-- Footer -->
    <div class="text-center pt-2 border-t border-amazon-gray">
      <p class="text-xs text-amazon-text-secondary">
        Remember your password? 
        <a routerLink="/login" class="text-amazon-link hover:text-amazon-link-hover font-semibold hover:underline">Sign in</a>
      </p>
    </div>

  </div>
</div>
