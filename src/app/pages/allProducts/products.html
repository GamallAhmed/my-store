<section class="container w-[75%] mx-auto my-8">
    
    <!-- Header -->
    <div class="text-center mb-8">
        <span class="inline-block uppercase tracking-widest text-xs font-semibold text-amber-600 bg-amber-500/10 px-3 py-1 rounded-full mb-2">
            Explore Collection
        </span>
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 bg-clip-text text-transparent pb-1">
            Recommended Products
        </h1>
        <div class="flex justify-center items-center mt-3 space-x-1">
            <span class="w-12 h-1 bg-amber-500 rounded-full"></span>
            <span class="w-2 h-2 bg-amber-600 rounded-full"></span>
            <span class="w-12 h-1 bg-amber-500 rounded-full"></span>
        </div>
    </div>

    <!-- Products Grid (لاحظ إحنا بنستخدم getPagiinationProducts() هنا) -->
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10">
      @for (prod of getPagiinationProducts(); track prod._id) {
           <div  class=" card border border-amazon-orange-dark rounded-2xl overflow-hidden shadow relative group cursor-pointer">
            
            <div [routerLink]="['/details',prod._id]">
               <div class="card-img">
                <img [src]="prod.imageCover" class="w-full" alt="">
            </div>
            
            <div class="card-body px-2 py-4">
                <h4 class="text-amazon-text text-xs">{{prod.category.name}}</h4>
                <h3 class="font-medium">
                  {{prod.title.split(' ',3).join(' ') }}</h3>
                <div class="flex justify-between items-center">
                    <span>{{prod.price}}</span>
                    <div class="flex items-center">
                    <i class="fas fa-star text-orange-400"></i>
                    <span class="text-gray-500">{{prod.ratingsAverage}}</span>
                    </div>
                </div>
            </div>
            </div>
            <button (click)="addToCart(prod._id)"
            
             class="bg-amazon-orange-dark cursor-pointer text-amazon-gray-light py-2 rounded-2xl w-[90%] mx-auto block my-2 
                           opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
              Add to Cart <i class="fa-solid fa-cart-plus"></i>
            </button>
            
        </div>
      }   
    </div>

    <!-- Pagination Buttons -->
    <div class="flex justify-center items-center space-x-3 mt-12">
        
        <!-- Prev Button -->
        <button (click)="changePage(currentPage - 1)" 
                [disabled]="currentPage === 1"
                class="px-4 py-2 rounded-xl font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors flex items-center gap-2">
          <i class="fa-solid fa-chevron-left text-xs"></i> Prev
        </button>

        <!-- Page 1 -->
        <button (click)="changePage(1)" 
                [class]="currentPage === 1 ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/30' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100'"
                class="w-10 h-10 rounded-xl font-medium transition-all">
          1
        </button>

        <!-- Page 2 -->
        <button (click)="changePage(2)" 
                [class]="currentPage === 2 ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/30' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100'"
                class="w-10 h-10 rounded-xl font-medium transition-all">
          2
        </button>

        <!-- Next Button -->
        <button (click)="changePage(currentPage + 1)" 
                [disabled]="currentPage === totalPages"
                class="px-4 py-2 rounded-xl font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors flex items-center gap-2">
          Next <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

    </div>

</section>
