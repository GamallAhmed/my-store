<nav class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-wrap md:flex-nowrap items-center justify-between h-auto md:h-16 py-3 md:py-0 gap-y-2">
      
      <!-- اللوجو -->
      <div class="flex-shrink-0 flex items-center logo">
        <a
          routerLink="/home"
          class="text-4xl font-bold tracking-wider text-amber-400 hover:text-amber-300 transition-colors"
        >
          My<span class="text-white">Store</span>
        </a>
      </div>

      <!-- اللينكات الرئيسية (تظهر فقط لو المستخدم مسجل دخول) -->
      @if (isLoggin()) {
        <div class="flex cursor-pointer items-center space-x-4 md:space-x-8 text-sm md:text-base order-3 md:order-2 w-full md:w-auto justify-center pt-2 md:pt-0 border-t md:border-t-0 border-slate-800">
          <a routerLink="/home" routerLinkActive="text-amber-400 font-semibold" [routerLinkActiveOptions]="{exact: true}">Home</a>
          <a routerLink="/products" routerLinkActive="text-amber-400 font-semibold" class="transition-colors">Products</a>
          <a routerLink="/brands" routerLinkActive="text-amber-400 font-semibold" class="transition-colors">Brands</a>
          <a routerLink="/categories" routerLinkActive="text-amber-400 font-semibold" class="transition-colors">Categories</a>

          <!-- سلة التسوق -->
          <a routerLink="/cart" routerLinkActive="text-amber-400" class="relative transition-colors p-2 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-cart-shopping text-xl"></i>
            @if (count() > 0) {
              <span class="absolute -top-1 -right-1 bg-amber-500 text-gray-900 font-extrabold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shadow-md">
                {{ count() }}
              </span>
            }
          </a>
        </div>
      }

      <!-- أزرار الدخول والخروج (تتبدل حسب الحالة) -->
      <div class="flex items-center order-2 md:order-3">
        @if (!isLoggin()) {
          <a
            routerLink="/login"
            class="bg-amber-500 mx-2 hover:bg-amber-600 text-slate-950 font-medium px-3.5 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm transition-colors"
          >
            Sign In
          </a>
          <!-- تم تصحيح الرابط هنا ليكون register -->
          <a
            routerLink="/register"
            class="bg-amber-500 mx-2 hover:bg-amber-600 text-slate-950 font-medium px-3.5 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm transition-colors"
          >
            Sign Up
          </a>
        } @else {
          <button
            (click)="signOut()"
            class="cursor-pointer bg-amber-500 mx-2 hover:bg-amber-600 text-slate-950 font-medium px-3.5 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm transition-colors"
          >
            LogOut
          </button>
        }
      </div>

    </div>
  </div>
</nav>
